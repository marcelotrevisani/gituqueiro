[package]
name = "gituqueiro"
version = "0.2.0"
edition = "2021"
description = "Desktop app for monitoring GitHub Pull Requests and repository health"
license = "MIT"
authors = ["Marcelo Duarte Trevisani"]
repository = "https://github.com/marcelotrevisani/gituqueiro"
homepage = "https://github.com/marcelotrevisani/gituqueiro"
readme = "README.md"
keywords = ["github", "pull-request", "monitoring", "desktop", "iced"]
categories = ["development-tools"]

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.24", default-features = false, features = ["png"] }
dirs = "6"
open = "5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
wiremock = "0.6"

[package.metadata.deb]
maintainer = "Marcelo Duarte Trevisani"
section = "utils"
priority = "optional"
assets = [
    ["target/release/gituqueiro", "usr/bin/", "755"],
]
